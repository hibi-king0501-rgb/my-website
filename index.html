<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ローン返済シミュレーター</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>ローン返済シミュレーター</h1>

        <p class="description">
            借入条件を入力すると、毎月の返済額を計算します。
        </p>

        <label for="amount">借入金額（円）</label>
        <input type="number" id="amount" placeholder="例：10000000">

        <label for="rate">年利（％）</label>
        <input type="number" id="rate" step="0.01" placeholder="例：1.5">

        <label for="years">返済期間（年）</label>
        <input type="number" id="years" placeholder="例：10">

        <button id="calculateButton">
            計算する
        </button>

        <div class="result">

            <h2>シミュレーション結果</h2>

            <p>
                毎月返済額
                <span id="monthlyPayment">-</span>
            </p>

            <p>
                総返済額
                <span id="totalPayment">-</span>
            </p>

            <p>
                総利息額
                <span id="totalInterest">-</span>
            </p>

        </div>

        <p class="note">
            ※元利均等返済・毎月返済として試算しています。
            実際の返済額とは異なる場合があります。
        </p>

    </div>

    <script src="script.js"></script>

</body>

</html>
